name: Refine issue

on:
  issues:
    types: [opened]

jobs:
  refine:
    # Public repo: strangers' issues would spend our quota and put untrusted
    # text in front of a session that can edit issues.
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # What "good" means lives in .claude/skills/refine-issue/SKILL.md.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: /refine-issue ${{ github.event.issue.number }}
          claude_args: >-
            --model sonnet
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"

      # The action hides Claude's output, including why a run failed. Print only
      # that message: show_full_output would put the whole session in public logs.
      - name: Show Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '.[] | select(.type == "result") | "::error::\(.result // .subtype)"' "$EXECUTION_FILE"
