name: Define the why

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# A second reply waits for the run in progress, then is read from the thread.
concurrency:
  group: define-the-why-${{ github.event.issue.number }}

jobs:
  define-the-why:
    # Public repo: strangers' issues would spend our quota and put untrusted
    # text in front of a session that can edit issues.
    # The conversation on an issue is its author's replies, and it ends when the
    # why is approved. Our own comments use GITHUB_TOKEN, so they trigger nothing.
    # Closed issues are out of scope until reopened.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      && github.event.issue.state == 'open'
      && (github.event_name == 'issues' || (
        !github.event.issue.pull_request
        && github.event.comment.user.login == github.event.issue.user.login
        && !contains(github.event.issue.labels.*.name, 'why-defined')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # What "good" means lives in .claude/skills/define-the-why/SKILL.md.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: /define-the-why ${{ github.event.issue.number }}
          claude_args: >-
            --model sonnet
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"

      - name: Clear an earlier failure label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label pipeline-failed || true

      # Our label adds trigger nothing, so start the next step ourselves.
      - name: Define the what once the why is approved
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if gh issue view "$ISSUE" --json labels --jq '.labels[].name' | grep -qx why-defined; then
            start=$(date -u -d '-10 seconds' +%FT%TZ)
            gh workflow run define-the-what.yml -f issue="$ISSUE"
            # A dispatch that is accepted but never starts would stall the issue
            # silently, so look for the run it should have created.
            for _ in 1 2 3 4 5 6; do
              sleep 10
              started=$(gh run list --workflow define-the-what.yml --event workflow_dispatch --limit 20 \
                --json createdAt --jq "map(select(.createdAt >= \"$start\")) | length")
              [ "$started" != 0 ] && exit 0
            done
            echo "::error::define-the-what.yml did not start after the hand-off for #$ISSUE."
            exit 1
          fi

      # Tell the author instead of stalling in silence. The label is created here
      # so no manual setup is needed, and cleared again by the next good run.
      - name: Say the step failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create pipeline-failed --force --repo "$GITHUB_REPOSITORY" \
            --color B60205 --description "A pipeline step failed or its hand-off did not start"
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label pipeline-failed
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            "The \"Define the why\" step failed or did not hand over to the next one, so this issue may be stalled. See [the run]($RUN_URL). Comment again, or dispatch \`define-the-what.yml\` for this issue if the why is already approved."

      # The action hides Claude's output, including why a run failed. Print only
      # that message: show_full_output would put the whole session in public logs.
      - name: Show Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '.[] | select(.type == "result") | "::error::\(.result // .subtype)"' "$EXECUTION_FILE"
