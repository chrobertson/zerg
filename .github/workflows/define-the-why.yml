name: Define the why

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# A second reply waits for the run in progress, then is read from the thread.
concurrency:
  group: define-the-why-${{ github.event.issue.number }}

jobs:
  define-the-why:
    # Public repo: strangers' issues would spend our quota and put untrusted
    # text in front of a session that can edit issues.
    # The conversation on an issue is its author's replies, and it ends when the
    # why is approved. Our own comments use GITHUB_TOKEN, so they trigger nothing.
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      && (github.event_name == 'issues' || (
        !github.event.issue.pull_request
        && github.event.issue.state == 'open'
        && github.event.comment.user.login == github.event.issue.user.login
        && !contains(github.event.issue.labels.*.name, 'why-defined')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # What "good" means lives in .claude/skills/define-the-why/SKILL.md.
      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: /define-the-why ${{ github.event.issue.number }}
          claude_args: >-
            --model sonnet
            --allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"

      # The action hides Claude's output, including why a run failed. Print only
      # that message: show_full_output would put the whole session in public logs.
      - name: Show Claude's error
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: jq -r '.[] | select(.type == "result") | "::error::\(.result // .subtype)"' "$EXECUTION_FILE"
